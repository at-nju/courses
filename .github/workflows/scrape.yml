name: Update course data

on:
  schedule:
    # 03:23 Asia/Shanghai every day.
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh scope
        required: true
        default: latest
        type: choice
        options:
          - latest
          - all

permissions:
  contents: write

concurrency:
  group: update-course-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Select refresh scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$MANUAL_MODE"
          elif [[ "$(TZ=Asia/Shanghai date +%d)" == "01" ]]; then
            mode="all"
          else
            mode="latest"
          fi

          if [[ "$mode" == "all" ]]; then
            echo "args=--all" >> "$GITHUB_OUTPUT"
            echo "commit_message=data: refresh all semesters" >> "$GITHUB_OUTPUT"
          else
            echo "args=--latest 2" >> "$GITHUB_OUTPUT"
            echo "commit_message=data: refresh latest semesters" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape course data
        env:
          NJU_CASTGC: ${{ secrets.NJU_CASTGC }}
        run: python scripts/scrape_courses.py ${{ steps.scope.outputs.args }}

      - name: Commit changed data
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ steps.scope.outputs.commit_message }}
        run: |
          git add data/

          if git diff --cached --quiet; then
            echo "Course data is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$COMMIT_MESSAGE"
          git push
